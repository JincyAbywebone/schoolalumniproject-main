{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}
<style>
    .target{
        color: red;
        text-align: right;
   }
     
</style>

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- general form elements -->
                    <form method="POST">
                        {% csrf_token %}
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">{{page_title}}</h3>
                        <div class="target" >                         
                            <a href="{% url 'detailed_evaluation' %} ">Detailed Evaluation</a>/
                            <a href="{% url 'student_view_result' %} ">Student View Result</a></div>
                    </div>


                    <!-- /.card-header -->
                    <!-- form start -->
                    <div class="card-body">

                        {{ form }}
                        <div class="form-group">
                            <label>Terms</label>
                          
                          <select name="term_wise" class="form-control" id="term_wise">
                              <option value="">----</option>
                              <option value="Term-1">Term-1</option>
                              <option value="Term-2">Term-2</option>
                              <option value="Term-3">Term-3</option>
                              {% comment %} {% for result in results  %}
                                <option value="{{result.term}}">{{result.term}}</option>
                                {% endfor %}  {% endcomment %}
                            </select>
                            </div>

                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                        <button type="button" id='fetch_student' class="btn btn-primary btn-block">
                            Submit</button>
                        <div class="form-group" id="student_data">

                        </div>
                    </div>
                </form>
                </div>
                <!-- /.card -->

            </div>
        </div>
    </div>
</section>
{% endblock content %}


{% block custom_js %}
<script>
    $(document).ready(function () {


        $("#fetch_student").click(function () {
           
            var term = $("#term_wise").val()
           $("#student_data").html(null)
if (term.length == 0 ){
    alert("Please select Term");
    return false;
}
            $.ajax({
                url: "{% url 'get_terms' %}",
                type: 'POST',
                data: {
                    term: term
                    
                }
            }).done(function (response) {
                
                var json_data = JSON.parse(response)
                
                if (json_data.length < 1) {
                    alert("No data to display")
                } else {
                   
                    var div_data = "<hr/><div class='form-group'> <label> Student Mark List</label>";
                    div_data += "<table class='table table-striped'>"; 
                    div_data += "<thead><tr><th>Subject</th><th>Test</th><th>Exam</th><th>Remarks</th></tr></thead><tbody>";

                    for (key in json_data) {
                        div_data += "<tr>";
                        div_data += "<td>" + json_data[key]['subject_name'] + "</td>";
                        div_data += "<td>" + json_data[key]['test'] + "</td>";
                        div_data += "<td>" + json_data[key]['exam'] + "</td>";
                        div_data += "<td>" + json_data[key]['remarks'] + "</td>";
                        div_data += "</tr>";
                        
                    }
                    div_data += "<tr>";
                     var term_wise = $("#term_wise").val()
                    
                     var generate_term_pdf1 = `{% url 'generate_term_pdf' 0 %}`.replace('/0/', `/${term_wise}/`);
                        div_data += `<td><center><a href="${generate_term_pdf1}">Download</a></center></td>`;
                            div_data += "</tr>";
                    div_data += "</tbody></table></div>";
                    $("#student_data").html(div_data)
                }
            }).fail(function (response) {
               alert("Error in fetching students")
            })




        })
    })
    </script>
{% endblock custom_js %}
