{% extends 'main_app/base.html' %}
{% block content %}
<div class="container mt-5">
    <h3>Edit Message</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
