{% extends "main_app/base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="mb-4">{{ page_title }}</h3>

    <form method="post" class="card p-4 shadow-sm border-0">
        {% csrf_token %}

        <div class="form-group mb-3">
            <label for="message">Message</label>
            <textarea 
                name="message" 
                id="message" 
                class="form-control" 
                rows="4"
                required
            >{{ message_obj.message }}</textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'view_group_chat' group_id=message_obj.chat_group.id %}" class="btn btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
