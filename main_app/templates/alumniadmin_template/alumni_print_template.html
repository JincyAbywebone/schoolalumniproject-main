{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{ page_title }}{% endblock page_title %}

{% block content %}
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">{{ page_title }}</h3><br>
                    </div>
                    <div class="card-body">
                        <form method="POST" class="mb-3">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-5">
                                    <label>Name:</label>
                                    <input type="text" name="name" id="name" class="form-control" placeholder="Search">

                                    <!-- Form Grid Container -->
                                <div class="row">
                                    <!-- Course Selector -->
                                    <div class="col-md-12 mb-3">
                                        <label class="font-weight-bold text-secondary">Course:</label>
                                        <select name="course" id="course" class="form-control w-100">
                                            <option value="">Select Course</option>
                                            {% for courses in course %}
                                                <option value="{{ courses.name }}">{{ courses.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>

                                    <!-- Employment Sectors Selector -->
                                    <div class="col-md-12 mb-3">
                                        <label class="font-weight-bold text-secondary">Employment Sectors:</label>
                                        <select name="emp_sec" id="emp_sec" class="form-control w-100">
                                            <option value="">Select Employment Sectors</option>
                                            <option value="Agriculture">Agriculture</option>
                                            <option value="Construction">Construction</option>
                                            <option value="Education">Education</option>
                                            <option value="Finance">Finance</option>
                                            <option value="Fisheries">Fisheries</option>
                                            <option value="Healthcare">Healthcare</option>
                                            <option value="Information Technology">Information Technology</option>
                                            <option value="Maritime">Maritime</option>
                                            <option value="Oil and Gas">Oil and Gas</option>
                                            <option value="Public Sector">Public Sector</option>
                                            <option value="Tourism and Hospitality">Tourism and Hospitality</option>
                                            <option value="Transportation">Transportation</option>
                                            <option value="Private Sector">Private Sector</option>
                                            <option value="others">others</option>
                                        </select>
                                    </div>

                                    <!-- Employment Status Selector -->
                                    <div class="col-md-12 mb-3">
                                        <label class="font-weight-bold text-secondary">Employment Status:</label>
                                        <select name="emp_status" id="emp_status" class="form-control w-100">
                                            <option value="">Select Employment Status</option>
                                            <option value="Employed">Employed</option>
                                            <option value="Seeking Employment">Seeking Employment</option>
                                            <option value="Self Employed">Self Employed</option>
                                            <option value="Business">Business</option>
                                            <option value="Student">Student</option>
                                        </select>
                                    </div>

                                    <!-- Year of Passing Selector (Fixed Width Layout) -->
                                    <div class="col-md-12 mb-4">
                                        <label class="font-weight-bold text-secondary">Year of Passing:</label>
                                        <!-- Removed input-group div wrappers to allow the select element to expand freely -->
                                        <select name="period_of_study" id="period_of_study" class="form-control w-100">
                                            <option value="">All Years</option>
                                            {% for year in passing_years %}
                                                <option value="{{ year }}">{{ year }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>

                                <!-- Form Submission Action Row -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <button type="button" id="submit" class="btn btn-primary px-4 py-2 shadow-sm">
                                            <i class="fas fa-search mr-2"></i>Search
                                        </button>
                                    </div>
                                </div>              

                            </div>
                        </form>
                        <div id="alumni_list" class="alumni_list mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}

{% block custom_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function () {
    $("#submit").click(function () {
        var course = $("#course").val();
        var emp_sec = $("#emp_sec").val();
        var emp_status = $("#emp_status").val();
        var name = $("#name").val();
        var period_of_study = $("#period_of_study").val();

        if (course == "" && emp_sec == "" && name == "" && emp_status == "" && period_of_study == "") {
            alert("Please enter a search");
            return;
        }

        $.ajax({
            url: "{% url 'alumni_search_list' %}",
            type: "POST",
            data: {
                course: course,
                emp_sec: emp_sec,
                name: name,
                emp_status: emp_status,
                period_of_study: period_of_study
            },
            success: function (response) {
                if (response.length === 0) {
                    $("#alumni_list").html("<p>No results found.</p>");
                    return;
                }

                var table = `
                    <style>
                        table {
                            border-collapse: collapse;
                            width: 100%;
                        }
                        th, td {
                            border: 2px solid black;
                            padding: 8px;
                            text-align: center;
                        }
                        thead {
                            background-color: #f2f2f2;
                        }
                    </style>
                    <div style="text-align: center;">
                        {% if school.image %}
                        <img src="{{ school.image.url }}" alt="Institution Emblem" style="width:100px; height:auto;">
                            {% else %}
                            <span class="text-muted">No Emblem</span>
                        {% endif %}
                        <h3>{{ school.name }}</h3>
                        <h4>{{ page_title }}</h4>
                    </div>

                    <table class='table table-bordered table-hover'>
                        <thead>
                            <tr>
                                <th>Sl.No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Course</th>
                                <th>District</th>
                                <th>Status</th>
                                <th>Employment Sectors</th>
                                <th>Year of Passing</th>
                            </tr>
                        </thead>
                        <tbody>`;

                response.forEach(function (item, index) {
                    table += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.email}</td>
                            <td>${item.mobile}</td>
                            <td>${item.course}</td>
                            <td>${item.district}</td>
                            <td>${item.status}</td>
                            <td>${item.employment_sectors}</td>
                            <td>${item.period_of_study}</td>
                        </tr>`;
                });

                table += `</tbody></table><input type='button' value='Print' id='print' class='btn btn-primary'>`;
                $("#alumni_list").html(table);

                $("#print").click(function () {
                    var printContents = document.getElementById('alumni_list').innerHTML;
                    var originalContents = document.body.innerHTML;
                    document.body.innerHTML = printContents;
                    window.print();
                    document.body.innerHTML = originalContents;
                    location.reload();
                });
            },
            error: function (xhr) {
                alert("Error: " + xhr.responseText);
            }
        });
    });
});
</script>
{% endblock custom_js %}
