{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{ page_title }}{% endblock page_title %}

{% block content %}
<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">{{ page_title }}</h3><br>
                    </div>
                    <div class="card-body">
                        <form method="POST" class="mb-3">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-5">
                                    <label>Name:</label>
                                    <input type="text" name="name" id="name" class="form-control" placeholder="Search">

                                    <label>Course:</label>
                                    <select name="course" id="course" class="form-control">
                                        <option value="">Select Course</option>
                                        {% for courses in course %}
                                            <option value="{{ courses.id }}">{{ courses.name }}-{{courses.division}}</option>
                                        {% endfor %}
                                    </select>

                                    <label>Gender</label>
                                    <select name="gender" id="gender" class="form-control">
                                        <option value="">Select Gender</option>
                                        <option value="M">Male</option>
                                        <option value="F">Female</option>
                                        <option value="O">Other</option>
                                    </select>

                                    <label>City</label>
                                    <select name="city" id="city" class="form-control">
                                        <option value="">Select City</option>
                                        {% for city in cities %}
                                            <option value="{{ city }}">{{ city }}</option>
                                        {% endfor %}
                                    </select>

                                    <label>District</label>
                                    <select name="district" id="district" class="form-control">
                                        <option value="">Select District</option>
                                        {% for district in districts %}
                                            <option value="{{ district }}">{{ district }}</option>
                                        {% endfor %}
                                    </select>
                                                                          
                                    <br>
                                    <button type="button" id="submit" class="btn btn-primary">Search</button>
                                </div>
                            </div>
                        </form>
                        <div id="alumni_list" class="alumni_list mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}

{% block custom_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function () {
    $("#submit").click(function () {
        var course = $("#course").val();
        var name = $("#name").val();
        var city = $("#city").val();
        var district = $("#district").val();
        var gender = $("#gender").val();
       
        // Optional: remove after debugging
        console.log("Course:", course);
        console.log("Name:", name);
        console.log("City:", city);
        console.log("District:", district);
        console.log("Gender:", gender);

        // Validation: if all empty
        if (!course && !name && !city && !district && !gender) {
            alert("Please enter a search");
            return;
        }

        $.ajax({
            url: "{% url 'student_search_list' %}",
            type: "GET",
            dataType: "json", // expect JSON response
            data: {
                course: course,
                name: name,
                city: city,
                district: district,
                gender: gender
            },
            success: function (response) {
               
                if (!response || response.length === 0) {
                    $("#alumni_list").html("<p>No results found.</p>");
                    return;
                }

                // Build table
                var table = `
                    <style>
                        table {
                            border-collapse: collapse;
                            width: 100%;
                        }
                        th, td {
                            border: 2px solid black;
                            padding: 8px;
                            text-align: center;
                        }
                        thead {
                            background-color: #f2f2f2;
                        }
                    </style>

                    <br><br>
                    <div style="text-align: center;">
                    {% for s in schools %}
                        {% if forloop.first %}
                            <img src="{{ s.image.url }}" alt="School Logo" style="width:100px; height:auto;">
                        {% endif %}
                   
                        <h3>{{ s.name }}</h3>
                        <h4>Student Information Table</h4> {% endfor %}
                    </div>

                    <table class='table table-bordered table-hover'>
                        <thead>
                            <tr>
                                <th>Sl.No</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Course</th>
                                <th>District</th>
                                <th>City</th>
                                <th>Gender</th>
                            </tr>
                        </thead>
                        <tbody>`;

                response.forEach(function (item, index) {
                    table += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.email}</td>
                            <td>${item.guardian_contact_number}</td>
                            <td>${item.course}</td>
                            <td>${item.district}</td>
                            <td>${item.city}</td>
                            <td>${item.gender}</td>
                        </tr>`;
                });

                table += `</tbody></table>
                          <input type='button' value='Print' id='print' class='btn btn-primary'>`;

                $("#alumni_list").html(table);

                // Print functionality
                $("#print").click(function () {
                    var printContents = document.getElementById('alumni_list').innerHTML;
                    var originalContents = document.body.innerHTML;
                    document.body.innerHTML = printContents;
                    window.print();
                    document.body.innerHTML = originalContents;
                    location.reload();
                });
            },
            error: function (xhr, status, error) {
                console.error("AJAX Error:", error);
                alert("Something went wrong while fetching results.");
            }
        });
    });
});
</script>
{% endblock custom_js %}
