{% extends 'main_app/base.html' %}

{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- general form elements -->
                    <form method="POST">
                        {% csrf_token %}
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">{{page_title}}</h3>
                    </div>
                   

                    <!-- /.card-header -->
                    <!-- form start -->
                    <div class="card-body">
                    <div class='form-group'><a href={% url 'student_excel_data2' %}>Download Excel Form</a></div>

                         
                                               {{ form }} 
                                               
                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                        <button type="button" id='exel_data' class="btn btn-primary btn-block">
                            Submit</button>
                             
                        <div class="form-group" id="bulk_data">

                        </div>
                    </div>
                </form>
                </div>
                <!-- /.card -->

            </div>
        </div>
    </div>
</section>
{% endblock content %}
