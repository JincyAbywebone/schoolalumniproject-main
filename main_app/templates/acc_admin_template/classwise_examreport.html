{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{ page_title }}{% endblock page_title %}
{% block content %}

<div class="container mt-4">
  <form method="GET" class="mb-4"> 
    <div class="row">
      <div class="col-md-4">
        <select name="staff_data" id="staff_data" class="form-control">
          <option value="">Select Staff</option>
          {% for staff in staff_members %}
          <option value="{{ staff.id }}">{{ staff }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <select name="subject_data_value" id="subject_data_value" class="form-control">
          <option value="">Select Exam</option>
          {% for exam in exam_type %}
          <option value="{{ exam.id }}">{{ exam.exam_name }}</option>
          {% endfor %}
        </select>
      </div>

<div class="col-md-4">
  
    <select class="form-control" id="session_select" name="session_select">
        {% if session %}
            <option value="{{ session.id }}" selected>
                {{ session.start_year }} - {{ session.end_year }}
            </option>
        {% else %}
            <option value="">No Active Session</option>
        {% endif %}
    </select>
</div>







      <div class="col-md-2 mt-3">
        <button type="button" id="student_graphdata" class="btn btn-primary w-100">View Table</button>
      </div>
    </div>
  </form>

  <div class="row mt-5">
    <div class="col-md-12" id="graphContainer"></div>
  </div>
</div>
<div class="mt-4 text-center">
  <button type="button" class="btn btn-secondary" onclick="printTable()">Print Table</button>
</div>
{% endblock content %}

{% block custom_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function () {
  $('#student_graphdata').click(function (e) {
    e.preventDefault(); 
    loadTable();        
  });
});

function loadTable() {
  const examtId = document.getElementById('subject_data_value').value;
  const staffId = document.getElementById('staff_data').value;
  const sessionId = document.getElementById('session_select').value;

  if (!examtId || !staffId || !sessionId) {
    alert("Please select all fields");
    return;
  }

  fetch(`/acc_admin/get_staff_graphmark/?staff_id=${staffId}&exam_id=${examtId}&session_id=${sessionId}`)
  .then(response => response.json())
  .then(data => {
    if (data.error) {
      alert(data.error);
      return;
    }

    const container = document.getElementById('graphContainer');
    container.innerHTML = ''; // clear old data

    data.subjects.forEach((subj) => {
      // heading
      const heading = document.createElement('h5');
      heading.innerText = `${subj.course_name} - ${subj.subject_name} (${data.exam_name})`;
      container.appendChild(heading);

      // table
      const table = document.createElement('table');
      table.className = "table table-bordered mt-3";

    table.innerHTML = `
  <thead class="table-light">
    <tr>
      <th>Sl. No</th>
      <th>Student Name</th>
      <th>Mark</th>
      {% comment %} <th>Percentage (%)</th>
    </tr> {% endcomment %}
  </thead>
  <tbody></tbody>
`;
const tbody = table.querySelector("tbody");

subj.students.forEach((student, idx) => {
  const examName = subj.labels[0];  
  const mark = student.marks[examName]?.mark ?? 0;
  const percentage = student.marks[examName]?.percentage ?? 0;

  const row = `
    <tr>
      <td>${idx + 1}</td>
      <td>${student.student_name}</td>
      <td>${mark}</td>
      {% comment %} <td>${percentage}</td> {% endcomment %}
    </tr>
  `;
  tbody.insertAdjacentHTML("beforeend", row);
});

      container.appendChild(table);
    });
  })
  .catch(error => {
    console.error("Error loading table data:", error);
    alert("Failed to load marks data.");
  });
}
function printTable() {
  const content = document.getElementById("graphContainer").innerHTML;
  const printWindow = window.open('', '', 'height=700,width=900');

  printWindow.document.write('<html><head><title>Print Student List</title>');
  printWindow.document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">');
  printWindow.document.write('</head><body>');
  printWindow.document.write('<h3 class="text-center mb-4">Student Marks Report</h3>');
  printWindow.document.write(content);
  printWindow.document.write('</body></html>');

  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => {
    printWindow.print();
    printWindow.close();
  }, 500);
}
</script>
{% endblock custom_js %}
