{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- general form elements -->
                    <form method="POST">
                        {% csrf_token %}
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">{{page_title}}</h3>
                    </div>


                    <!-- /.card-header -->
                    <!-- form start -->
                    <div class="card-body">
                        <div class="form-group">
                            <label>Course</label>
                            <select name="course1" class="form-control" id='course1'>
                                <option value="">----</option>
                                {% for course in data_list  %}
                                <option value="{{course.course.id}}">{{course.course.name}}-{{course.course.division}}</option> 
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Subject</label>
                            <select name="subject" class="form-control" id='subject_data'>
                              
                            </select>
                        </div>


                        <div class="form-group">
                            <label>Session Year</label>
                            <select name="session" id='session' class="form-control">
                                <option value="">----</option>
                                {% for session in sessions  %}
                                <option value="{{session.id}}">{{session}} </option>
                                {% endfor %}
                            </select>
                        </div>


                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                        <button type="button" id='fetch_student' class="btn btn-primary btn-block">Fetch
                            Students</button>
                        <div class="form-group" id="student_data">

                        </div>
                    </div>
                </form>
                </div>
                <!-- /.card -->

            </div>
        </div>
    </div>
</section>
{% endblock content %}


{% block custom_js %}
<script>
    $("#course1").change(function () {
        var course = $("#course1").val()
        $("#subject_data").html(null)
        if (course.length == 0) {
            alert("Please select course");
            return false;
        }
        $.ajax({
            url: "{% url 'staff_get_course' %}",
            type: 'POST',
            data: {
                course: course,
            }
        }).done(function (response) {
            var json_data = JSON.parse(response)

            if (json_data.length < 1) {
                alert("No data to display")
            } else {
                var div_data = "</hr><div class='form-group'> <label>Subject</label> <select class ='form-control' name ='subject_data1' id='subject_data1'>"
                for (key in json_data) {
                    div_data += "<option value='" + json_data[key]['id'] + "'>" + json_data[key]['name'] + "</option>"
                }
                div_data += "</select></div>"
                $("#subject_data").html(div_data);
            }

        }).fail(function (response) {
            alert("Error in fetching subjects")
        })
    })

    $(document).ready(function () {
        $("#fetch_student").click(function () {
            var course = $("#course1").val()
            var subject = $("#subject_data").val()
            var session = $("#session").val()
            $("#student_data").html(null)

            if (subject.length == 0 || session.length == 0 || course.length == 0) {
                alert("Please select session and subject");
                return false;
            }

            $.ajax({
                url: "{% url 'get_students' %}",
                type: 'POST',
                data: {
                    subject: subject,
                    session: session,
                    course: course
                }
            }).done(function (response) {
                var json_data = JSON.parse(response)
                if (json_data.length < 1) {
                    alert("No data to display")
                } else {
                    var div_data = "<hr/><div class='form-group'> <label> Student List</label> <select class='student_list form-control' name='student_list'> "

                    for (key in json_data) {
                        div_data += "<option value='" + json_data[key]['id'] + "'>" + json_data[key]['name'] + " </option>"
                    }

                    div_data += "</select></div>"
                    div_data += `
                    <div class='form-group row'>
                        <div class='col-md-6'>
                            <label> Test Score </label>
                            <input class='form-control' id='test_score' name='test' placeholder='Test Score' />
                        </div>
                        <div class='col-md-6'>
                            <label> Exam Score </label>
                            <input class='form-control' id='exam_score' placeholder='Exam Score' name='exam' />
                        </div>
                        <div class='col-md-6'>
                            <label> Remarks </label>
                            <select class='form-control' name='remarks'>
                                <option value=''>----</option>
                                <option value='Excellent'>Excellent</option>
                                <option value='Very Good'>Very Good</option>
                                <option value='Good'>Good</option>
                                <option value='Average'>Average</option>
                                <option value='Below Average'>Below Average</option>
                                <option value='Poor'>Poor</option>
                            </select>
                        </div>
                        <div class='col-md-6'>
                            <label> Term </label>
                            <select class='form-control' id='term_select' name='term'>
                                <option value=''>----</option>
                                <option value='Term-1'>Term-1</option>
                                <option value='Term-2'>Term-2</option>
                            </select>
                        </div>
                    </div>
                    <div class='form-group'>
                        <button id='save_attendance' class='btn btn-success' type='submit'>Save Result</button>
                    </div>`;

                    $("#student_data").html(div_data)

                    // Add validation on submit
                    $("#save_attendance").click(function (e) {
                        var exam = parseFloat($("#exam_score").val());
                        var term = $("#term_select").val();

                        if (term === "Term-1" || term === "Term-2") {
                            if (isNaN(exam) || exam > 50 || exam < 0) {
                                alert("Exam score for " + term + " should be a number between 0 and 50.");
                                e.preventDefault();  // Stop form submission
                            }
                        }
                    });
                }
            }).fail(function (response) {
                alert("Error in fetching students")
            })
        })
    })
</script>
{% endblock custom_js %}
